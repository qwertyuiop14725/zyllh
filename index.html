<!DOCTYPE html>
<html lang="zh-CN" class="pfs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title> llh科技已经侵入 </title>
<style>
:root{
  --r:#ff1e1e;
  --r2:#a00;
  --w:#fff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

/* 满屏锁定：不等真全屏，CSS 先撑满 */
html.pfs,html.pfs body{
  position:fixed!important;inset:0!important;
  width:100%!important;height:100%!important;
  margin:0!important;padding:0!important;
  overflow:hidden!important;overscroll-behavior:none!important;
}
html{height:100%;background:#000;}
body{
  background:#000;color:var(--w);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",
              "Helvetica Neue",sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-font-smoothing:antialiased;
  touch-action:none;
  cursor:default;
}

/* ===== 画布 ===== */
#noise,#vig{position:fixed;inset:0;pointer-events:none;display:block;}
#noise{z-index:2;opacity:.5;}
#vig{z-index:3;}

/* ===== 主舞台 ===== */
#world{position:fixed;inset:0;z-index:10;will-change:transform,filter;}

/* ===== 入口 ===== */
#gate{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);
  padding:0 7vw;text-align:center;background:#000;}
#gate .g1{font-size:clamp(22px,7.4vw,58px);font-weight:900;letter-spacing:clamp(2px,1.2vw,8px);
  color:var(--w);text-shadow:0 0 26px rgba(255,30,30,.9),0 0 70px rgba(160,0,0,.7);
  line-height:1.25;}
#gate .g2{font-size:clamp(10px,2.9vw,14px);color:#8a2a2a;letter-spacing:2px;line-height:1.9;}
#gate .g3{font-size:clamp(9px,2.6vw,12px);color:#4a1010;letter-spacing:1px;line-height:1.8;}
#enter{
  margin-top:clamp(8px,2vh,20px);
  padding:clamp(15px,3vh,24px) clamp(36px,12vw,70px);
  font:900 clamp(15px,4.4vw,22px)/1 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  letter-spacing:clamp(2px,1vw,6px);
  color:#fff;background:#c00;border:2px solid #fff;border-radius:4px;
  box-shadow:0 0 44px rgba(255,0,0,.7);cursor:pointer;}
#enter:active{transform:scale(.95);background:#f00;}

/* ===== 大字接管 ===== */
#main{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 10px) 5vw
          calc(env(safe-area-inset-bottom) + 10px);}
#main.on{display:flex;}

#title{
  font-size:clamp(30px,12.6vw,150px);
  font-weight:900;
  line-height:1.06;
  letter-spacing:clamp(1px,.6vw,6px);
  text-align:center;
  color:#fff;
  text-shadow:
    0 0 18px rgba(255,20,20,.95),
    0 0 48px rgba(200,0,0,.85),
    0 0 110px rgba(120,0,0,.7),
    4px 0 0 rgba(255,0,0,.55),
    -4px 0 0 rgba(0,220,255,.28);
  animation:tpulse 2.4s ease-in-out infinite;
  word-break:break-word;
}
@keyframes tpulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.86;transform:scale(1.018);}
}

#sub{
  margin-top:clamp(12px,2.8vh,30px);
  font-size:clamp(11px,3.3vw,19px);
  font-weight:700;
  letter-spacing:clamp(1px,.7vw,5px);
  color:var(--r);
  text-align:center;
  min-height:1.6em;
  text-shadow:0 0 20px rgba(255,20,20,.85);
}

/* ===== 脏话飘字 ===== */
.fw{position:absolute;font-weight:900;white-space:nowrap;pointer-events:none;
  color:rgba(255,30,30,.92);
  text-shadow:0 0 14px rgba(255,0,0,.9),0 0 34px rgba(140,0,0,.85);
  opacity:0;transition:opacity .28s;z-index:11;}
.fw.on{opacity:1;}

/* ===== 底部脏话跑马灯 ===== */
#tick{position:absolute;left:0;right:0;bottom:0;z-index:12;
  padding:calc(4px + env(safe-area-inset-bottom)) 0 4px;
  background:rgba(90,0,0,.9);overflow:hidden;white-space:nowrap;
  border-top:1px solid rgba(255,40,40,.5);}
#tick .t{display:inline-block;white-space:nowrap;
  font-size:clamp(9px,2.6vw,13px);font-weight:900;letter-spacing:2px;color:#fff;
  animation:roll 14s linear infinite;}
@keyframes roll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

/* ===== 顶部条 ===== */
#top{position:absolute;left:0;right:0;top:0;z-index:12;
  padding:calc(4px + env(safe-area-inset-top)) 10px 4px;
  background:rgba(120,0,0,.9);text-align:center;
  font-size:clamp(9px,2.5vw,12px);font-weight:900;letter-spacing:2px;color:#fff;
  animation:bl 1.1s steps(1) infinite;}
@keyframes bl{50%{opacity:0;}}

/* ===== 闪白/闪黑 ===== */
#flash{position:fixed;inset:0;z-index:13;pointer-events:none;opacity:0;background:#fff;}
#dark{position:fixed;inset:0;z-index:13;pointer-events:none;opacity:0;background:#000;}

/* ===== 墙 ===== */
#wall{position:fixed;inset:0;z-index:240;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);
  background:rgba(0,0,0,.98);text-align:center;padding:0 8vw;}
#wall.on{display:flex;}
#wall .w1{color:var(--r);font-size:clamp(18px,6vw,46px);font-weight:900;
  letter-spacing:clamp(2px,1vw,6px);text-shadow:0 0 26px rgba(255,20,20,.9);}
#wall .w2{color:#fff;font-size:clamp(11px,3.1vw,17px);font-weight:700;
  letter-spacing:2px;line-height:1.9;animation:bl 1.1s steps(1) infinite;}
#wall .w3{color:#7a2020;font-size:clamp(9px,2.6vw,13px);letter-spacing:1px;line-height:1.9;}
#wall .w4{color:#5a1010;font-size:clamp(8px,2.4vw,12px);letter-spacing:1px;
  font-variant-numeric:tabular-nums;}

/* ===== 闪屏 ===== */
#guard{position:fixed;inset:0;z-index:245;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.92);pointer-events:none;padding:0 8vw;text-align:center;}
#guard.on{display:flex;}
#guard .g{color:var(--r);font-size:clamp(22px,7vw,54px);font-weight:900;
  letter-spacing:clamp(2px,1vw,6px);text-shadow:0 0 30px rgba(255,20,20,.9);
  animation:gsh .1s infinite;}
@keyframes gsh{0%{transform:translate(0,0);}33%{transform:translate(-4px,3px);}
  66%{transform:translate(4px,-3px);}100%{transform:translate(0,0);}}

/* ===== 复活条 ===== */
#revive{position:fixed;left:0;right:0;top:0;z-index:247;display:none;
  padding:calc(3px + env(safe-area-inset-top)) 8px 3px;
  background:rgba(255,30,30,.94);color:#fff;font-size:clamp(8px,2.3vw,11px);
  letter-spacing:2px;text-align:center;font-weight:900;animation:bl 1.2s steps(1) infinite;}
#revive.on{display:block;}

/* ===== 抖动 ===== */
.shake{animation:shk .075s infinite;}
@keyframes shk{0%{transform:translate(0,0);}25%{transform:translate(-6px,4px);}
  50%{transform:translate(5px,-5px);}75%{transform:translate(-4px,-3px);}
  100%{transform:translate(4px,5px);}}
</style>
</head>
<body>
<canvas id="noise"></canvas>
<canvas id="vig"></canvas>
<div id="flash"></div>
<div id="dark"></div>

<div id="revive">♻ 关不掉的 · 刷新也没用</div>

<div id="world">

  <div id="gate">
    <div class="g1">你的设备<br>已经被盯上了</div>
    <div class="g2">点下面这个按钮，你就退不出去了</div>
    <button id="enter">我点</button>
    <div class="g3">劝你别点 · 点了就是你自己找的</div>
  </div>

  <div id="main">
    <div id="top">⚠ llh科技已经侵入 · 关不掉的 ⚠</div>
    <div id="title">llh科技<br>已经侵入</div>
    <div id="sub">别他妈关</div>
    <div id="tick"><span class="t" id="tickTxt"></span></div>
  </div>

</div>

<div id="wall">
  <div class="w1">全屏掉了</div>
  <div class="w2">给我滚回来 · 碰一下就恢复</div>
  <div class="w3">别他妈找按钮，整块屏幕都能点</div>
  <div class="w4" id="wallT">已锁 0 秒</div>
</div>

<div id="guard"><div class="g" id="guardTxt">关不掉</div></div>

<script>
'use strict';

/* ============================================================
   llh科技已经侵入 — 纯前端表演
   满屏锁定：html.pfs 常驻，不等真全屏
   DEV_ESCAPE=false 时页面内无出口
   ============================================================ */
var DEV_ESCAPE = false;

var $ = function(id){ return document.getElementById(id); };
var T = [], RAF = [];
function ev(fn, ms){ var id = setInterval(fn, ms); T.push(id); return id; }
function to(fn, ms){ var id = setTimeout(fn, ms); T.push(id); return id; }
function raf(fn){ var id = requestAnimationFrame(fn); RAF.push(id); return id; }
function rnd(n){ return Math.random() * n; }
function ri(n){ return (Math.random() * n) | 0; }
function pick(a){ return a[ri(a.length)]; }

var running = false;
var escCount = 0;
var W = 0, H = 0, DPR = 1;
var CFG = { sound:true, vib:true, anti:true, full:true };

/* ==================== 画布 ==================== */
var noise = $('noise'), nc = noise.getContext('2d');
var vig = $('vig'), vc = vig.getContext('2d');
var noiseCv = null, noisec = null;

function initNoise(){
  noiseCv = document.createElement('canvas');
  noiseCv.width = 100;
  noiseCv.height = 70;
  noisec = noiseCv.getContext('2d');
}
initNoise();

function fit(){
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  [noise, vig].forEach(function(cv){
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
  });
  nc.setTransform(DPR, 0, 0, DPR, 0, 0);
  vc.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawVig();
}
fit();

var rt = null;
function onResize(){
  if(rt) clearTimeout(rt);
  rt = setTimeout(fit, 140);
}
window.addEventListener('resize', onResize, { passive:true });
window.addEventListener('orientationchange', function(){ setTimeout(onResize, 260); }, { passive:true });

/* 静态暗角 */
function drawVig(){
  vc.clearRect(0, 0, W, H);
  var g = vc.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.18,
                                  W / 2, H / 2, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, 'rgba(20,0,0,.42)');
  g.addColorStop(1, 'rgba(60,0,0,.85)');
  vc.fillStyle = g;
  vc.fillRect(0, 0, W, H);
}

/* 噪点 */
var noiseOn = false;
function noiseLoop(){
  if(!noiseOn) return;
  var img = noisec.createImageData(100, 70);
  var d = img.data;
  for(var i = 0; i < d.length; i += 4){
    var v = (Math.random() * 255) | 0;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
  noisec.putImageData(img, 0, 0);
  nc.save();
  nc.globalAlpha = 0.045 + Math.random() * 0.03;
  nc.imageSmoothingEnabled = false;
  nc.drawImage(noiseCv, 0, 0, W, H);
  nc.restore();
  raf(noiseLoop);
}

/* ==================== 音频 ==================== */
var AC = null, master = null;
function audioInit(){
  if(AC) return;
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    AC = new Ctx();
    master = AC.createGain();
    master.gain.value = 0.16;
    master.connect(AC.destination);
  }catch(e){ AC = null; }
}
function audioResume(){
  if(!AC) return;
  if(AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
}
function beep(freq, dur, type, vol){
  if(!AC || !CFG.sound) return;
  audioResume();
  try{
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.18, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur);
  }catch(e){}
}
function vib(p){
  if(!CFG.vib) return;
  try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){}
}

var VIB_PAT = [900, 130, 900, 130, 1300, 130];
var vibT = null;
function vibLoop(){
  if(!running || !CFG.vib) return;
  try{ if(navigator.vibrate) navigator.vibrate(VIB_PAT); }catch(e){}
}
function startVib(){
  if(vibT) return;
  vibLoop();
  vibT = setInterval(vibLoop, 3500);
}
function stopVib(){
  if(vibT){ clearInterval(vibT); vibT = null; }
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
}

/* ============================================================
   全屏守护引擎 v3  —  六条路并行
   ------------------------------------------------------------
   ① 多点目标：documentElement → body → #world，谁行用谁
   ② 级联重试：0/16/50/120/300/600/1000/1800/3000ms 九连击
   ③ userActivation 轮询：手势后 5 秒激活窗口，50ms 一拍打穿
   ④ Pointer Lock 双锁：Esc 第一下只解指针，第二下才退全屏
   ⑤ 多信号丢失检测：fullscreenchange + resize + visualViewport + 高度突变
   ⑥ exitFullscreen 劫持：把退出方法改成空壳
   ============================================================ */
var FS = {
  everOk: false,
  wallOn: false,
  wallT: null,
  wallSec: 0,
  kbLocked: false,
  lastGesture: 0,
  lastRestore: 0,
  cascade: [],
  polling: false,
  plock: false
};

function fsNow(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement ||
            document.mozFullScreenElement || document.msFullscreenElement);
}

function fsTargets(){
  var t = [];
  if(document.documentElement) t.push(document.documentElement);
  if(document.body) t.push(document.body);
  var w = $('world');
  if(w) t.push(w);
  return t;
}

/* 对一个元素发起全屏请求，返回 true/false/Promise */
function fsCall(el){
  if(!el) return null;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen ||
           el.mozRequestFullScreen || el.msRequestFullscreen;
  if(!fn) return null;
  try{
    var r;
    try{ r = fn.call(el, { navigationUI:'hide' }); }
    catch(e1){ r = fn.call(el); }     /* 老浏览器不认 options */
    return r || true;
  }catch(e){
    return false;
  }
}

/* 逐个目标试，成功即停 */
function fsTryNow(){
  if(!running || !CFG.full) return false;
  if(fsNow()){ onFsOk(); return true; }

  var targets = fsTargets();
  for(var i = 0; i < targets.length; i++){
    var r = fsCall(targets[i]);
    if(r === null) continue;
    if(r && r.then){
      (function(p){ p.then(onFsOk).catch(function(){}); })(r);
    }
    if(fsNow()){ onFsOk(); return true; }
  }
  return fsNow();
}

/* 级联：九个时间点各试一次 */
function fsCascade(){
  fsClearCascade();
  var delays = [0, 16, 50, 120, 300, 600, 1000, 1800, 3000];
  for(var i = 0; i < delays.length; i++){
    (function(d){
      var id = setTimeout(function(){
        if(!running) return;
        if(fsNow()) return;
        fsTryNow();
      }, d);
      FS.cascade.push(id);
    })(delays[i]);
  }
}
function fsClearCascade(){
  for(var i = 0; i < FS.cascade.length; i++) clearTimeout(FS.cascade[i]);
  FS.cascade = [];
}

/* 激活窗口判定 */
function gestureFresh(){
  try{
    if(navigator.userActivation && typeof navigator.userActivation.isActive === 'boolean'){
      return navigator.userActivation.isActive;
    }
  }catch(e){}
  return (Date.now() - FS.lastGesture) < 4800;
}

/* 激活窗口内 50ms 一拍，硬打 */
function fsArmPoller(){
  if(FS.polling) return;
  FS.polling = true;
  var deadline = Date.now() + 5200;
  function tick(){
    if(!running){ FS.polling = false; return; }
    if(Date.now() > deadline){ FS.polling = false; return; }
    if(!fsNow() && gestureFresh()) fsTryNow();
    setTimeout(tick, 50);
  }
  tick();
}

/* Pointer Lock 双锁：Esc 第一下只解指针 */
function plockArm(){
  try{
    var el = document.body || document.documentElement;
    if(el && el.requestPointerLock && !document.pointerLockElement){
      var r = el.requestPointerLock();
      if(r && r.then) r.then(function(){ FS.plock = true; }).catch(function(){});
      else FS.plock = true;
    }
  }catch(e){}
}
document.addEventListener('pointerlockchange', function(){
  if(!running) return;
  FS.plock = !!document.pointerLockElement;
  if(!FS.plock && !fsNow()){
    /* 指针被解了，全屏也没了 → 立刻重来 */
    onFsLost();
  }else if(!FS.plock){
    setTimeout(plockArm, 60);
  }
});

/* 键盘锁 */
function lockKeys(){
  try{
    if(navigator.keyboard && navigator.keyboard.lock){
      navigator.keyboard.lock(['Escape','F11','Tab','MetaLeft','MetaRight','AltLeft'])
        .then(function(){ FS.kbLocked = true; }).catch(function(){});
    }
  }catch(e){}
}
function unlockKeys(){
  try{
    if(navigator.keyboard && navigator.keyboard.unlock){
      navigator.keyboard.unlock(); FS.kbLocked = false;
    }
  }catch(e){}
}

/* 方向锁 */
function lockOrient(){
  try{
    if(screen.orientation && screen.orientation.lock){
      var p = screen.orientation.lock('portrait');
      if(p && p.catch) p.catch(function(){});
    }
  }catch(e){}
}

/* ---- 状态回调 ---- */
function onFsOk(){
  FS.everOk = true;
  FS.lastRestore = Date.now();
  if(!FS.kbLocked) lockKeys();
  hideWall();
  document.documentElement.classList.add('pfs');
}

function onFsLost(){
  if(!running) return;
  var now = Date.now();
  if(now - FS.lastRestore < 250) return;   /* 防抖，避免自己打自己 */
  FS.lastRestore = now;

  showWall();
  fsTryNow();
  fsCascade();
  fsArmPoller();
  plockArm();
  lockOrient();
}

/* ---- 墙 ---- */
function showWall(){
  if(!running || FS.wallOn) return;
  FS.wallOn = true;
  $('wall').classList.add('on');
  if(FS.wallT) clearInterval(FS.wallT);
  FS.wallSec = 0;
  var el = $('wallT');
  if(el) el.textContent = '已锁 0 秒';
  FS.wallT = setInterval(function(){
    if(!FS.wallOn){ clearInterval(FS.wallT); FS.wallT = null; return; }
    FS.wallSec++;
    var e2 = $('wallT');
    if(e2) e2.textContent = '已锁 ' + FS.wallSec + ' 秒 · 自动恢复中';
    if(FS.wallSec % 5 === 0) beep(130, 0.08, 'square', 0.15);
  }, 1000);
}
function hideWall(){
  FS.wallOn = false;
  if(FS.wallT){ clearInterval(FS.wallT); FS.wallT = null; }
  $('wall').classList.remove('on');
}

/* ---- 信号 1：全屏状态变化 ---- */
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(function(t){
  document.addEventListener(t, function(){
    if(!running) return;
    if(fsNow()) onFsOk();
    else onFsLost();
  });
});

/* ---- 信号 2：全屏请求失败 ---- */
['fullscreenerror','webkitfullscreenerror'].forEach(function(t){
  document.addEventListener(t, function(){
    if(!running) return;
    if(!fsNow()) onFsLost();
  });
});

/* ---- 信号 3：resize（浏览器 UI 回来会触发） ---- */
var rzT = null;
window.addEventListener('resize', function(){
  if(!running) return;
  if(rzT) clearTimeout(rzT);
  rzT = setTimeout(function(){
    if(!running) return;
    if(!fsNow()) onFsLost();
  }, 120);
}, { passive:true });

/* ---- 信号 4：visualViewport 变化 ---- */
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', function(){
    if(!running) return;
    if(!fsNow()) onFsLost();
  }, { passive:true });
}

/* ---- 信号 5：高度突变启发式（全屏丢失时视口高度会变） ---- */
var lastH = 0;
function heightWatch(){
  if(!running) return;
  var h = window.innerHeight;
  if(lastH && Math.abs(h - lastH) > 40 && !fsNow()) onFsLost();
  lastH = h;
  setTimeout(heightWatch, 400);
}

/* ---- 信号 6：常驻巡检 ---- */
var watchT = null;
function startWatch(){
  if(watchT) return;
  watchT = setInterval(function(){
    if(!running) return;
    if(fsNow()){ if(!FS.everOk) onFsOk(); return; }
    onFsLost();
  }, 450);
  heightWatch();
}
function stopWatch(){
  if(watchT){ clearInterval(watchT); watchT = null; }
}

/* ---- 所有手势：同步打一轮 + 布级联 + 锁指针 ---- */
['touchstart','touchend','touchcancel','pointerdown','pointerup',
 'mousedown','mouseup','click','keydown','keyup','wheel','scroll'].forEach(function(t){
  document.addEventListener(t, function(){
    if(!running || !CFG.full) return;
    FS.lastGesture = Date.now();
    if(fsNow()) return;
    fsTryNow();
    fsCascade();
    fsArmPoller();
    plockArm();
  }, { passive:true });
});

/* ---- 墙：碰一下就恢复 ---- */
(function(){
  var w = $('wall');
  function tap(e){
    if(e && e.preventDefault) e.preventDefault();
    FS.lastGesture = Date.now();
    if(fsNow()){ hideWall(); return; }
    fsTryNow();
    fsCascade();
    fsArmPoller();
  }
  w.addEventListener('click', tap);
  w.addEventListener('touchstart', tap, { passive:false });
  w.addEventListener('touchend', tap, { passive:false });
  w.addEventListener('pointerdown', tap);
})();

/* ---- ⑥ 劫持 exitFullscreen：外部脚本想退也退不掉 ---- */
(function(){
  var names = ['exitFullscreen','webkitExitFullscreen','mozCancelFullScreen','msExitFullscreen'];
  for(var i = 0; i < names.length; i++){
    (function(n){
      try{
        if(document[n]){
          document[n] = function(){
            if(running){ onFsLost(); return Promise.resolve(); }
            return Promise.resolve();
          };
        }
      }catch(e){}
    })(names[i]);
  }
})();

/* 内部真退出用（DEV 用） */
function exitFull(){
  try{
    var d = Document.prototype;
    var fn = d.exitFullscreen || d.webkitExitFullscreen ||
             d.mozCancelFullScreen || d.msExitFullscreen;
    if(fn && fsNow()) fn.call(document);
  }catch(e){}
}

/* ---- 启动 ---- */
function fsBoot(){
  document.documentElement.classList.add('pfs');
  FS.lastGesture = Date.now();
  fsTryNow();
  fsCascade();
  fsArmPoller();
  plockArm();
  lockKeys();
  lockOrient();
  startWatch();
}

/* ============================================================
   防退出 —— 十层
   ============================================================ */
function bombHistory(n){
  try{
    for(var i = 0; i < n; i++) history.pushState({ b:i }, '', '#' + Date.now() + '_' + i);
  }catch(e){}
}

window.addEventListener('popstate', function(){
  if(!running || !CFG.anti) return;
  try{ history.pushState({ b:-1 }, '', '#' + Date.now()); }catch(e){}
  escCount++;
  flashGuard(escCount > 2 ? '别他妈按了' : '回不去了');
  vib(45);
  beep(150, 0.07, 'square', 0.13);
});

window.addEventListener('beforeunload', function(e){
  if(!running || !CFG.anti) return;
  e.preventDefault();
  e.returnValue = '';
  return '';
});

var wakeLock = null;
function keepAwake(){
  if(!CFG.anti) return;
  try{
    if(navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(function(l){
        wakeLock = l;
        l.addEventListener('release', function(){ wakeLock = null; });
      }).catch(function(){});
    }
  }catch(e){}
}
function releaseAwake(){
  try{ if(wakeLock && wakeLock.release) wakeLock.release(); }catch(e){}
  wakeLock = null;
}

/* 手势全封 */
document.addEventListener('touchmove', function(e){
  if(running && e.cancelable) e.preventDefault();
}, { passive:false });
['gesturestart','gesturechange','gestureend'].forEach(function(t){
  document.addEventListener(t, function(e){ if(running) e.preventDefault(); }, { passive:false });
});
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ if(running) e.preventDefault(); });
document.addEventListener('selectstart', function(e){ e.preventDefault(); });
document.addEventListener('dragstart', function(e){ e.preventDefault(); });
document.addEventListener('touchstart', function(e){
  if(e.touches && e.touches.length > 1 && running) e.preventDefault();
}, { passive:false });

document.addEventListener('visibilitychange', function(){
  if(!document.hidden && running){
    flashGuard('还在这呢');
    vib(25);
    keepAwake();
    if(!fsNow()) onFsLost();
  }else if(document.hidden && running){
    document.title = '别切走';
  }
});

window.addEventListener('pageshow', function(e){
  if(e.persisted && running){
    flashGuard('又回来了？');
    bombHistory(150);
    keepAwake();
    startVib();
    if(!fsNow()) onFsLost();
  }
});

window.addEventListener('blur', function(){
  if(running && CFG.anti) setTimeout(function(){ try{ window.focus(); }catch(e){} }, 60);
});

window.addEventListener('scroll', function(){
  if(running) window.scrollTo(0, 0);
}, { passive:true });

var guardT = null;
function flashGuard(txt){
  var g = $('guard'), t = $('guardTxt');
  t.textContent = txt || '关不掉';
  g.classList.add('on');
  if(guardT) clearTimeout(guardT);
  guardT = setTimeout(function(){ g.classList.remove('on'); }, 950);
}

/* ============================================================
   自复活
   ============================================================ */
var ALIVE = 'LLH2_ALIVE';
function markAlive(){ try{ window.name = ALIVE; }catch(e){} }
function isAlive(){ try{ return window.name === ALIVE; }catch(e){ return false; } }
function clearAlive(){ try{ window.name = ''; }catch(e){} }

function checkRevive(){
  if(!isAlive() || running) return;
  $('revive').classList.add('on');
  setTimeout(function(){ $('revive').classList.remove('on'); }, 2800);
  startShow();
}
window.addEventListener('pageshow', function(e){ if(e.persisted) checkRevive(); });
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && !running && isAlive()) setTimeout(checkRevive, 400);
});
window.addEventListener('load', function(){
  setTimeout(function(){ if(!running && isAlive()) checkRevive(); }, 300);
});

/* ============================================================
   文案库
   ============================================================ */
var SUBS = [
  '别他妈关',
  '关不掉的',
  '滚不掉的',
  '你退一个试试',
  '操，没用吧',
  '妈的，别点了',
  '你他妈以为能关？',
  '傻逼才试第二次',
  '这破玩意卸不掉',
  '滚回你的桌面去吧',
  '我操，还挺倔',
  '别挣扎了',
  '你再点一下试试',
  '草，关不掉吧',
  '他妈的，服不服'
];

var FWORDS = [
  '操', '妈的', '他妈的', '傻逼', '滚', '闭嘴', '别动', '我操',
  '草', '靠', '干', '滚蛋', '别他妈碰', '你他妈', '服不服',
  '关不掉', '别挣扎', '放弃吧', '没用的', '再来啊'
];

var TICKER = ' llh科技已经侵入 ｜ 关不掉的 ｜ 别他妈关 ｜ 滚不掉的 ｜ ' +
             '你退一个试试 ｜ 操 ｜ 妈的 ｜ 傻逼才试第二次 ｜ 放弃吧 ｜ 没用的 ｜ ';

/* ============================================================
   主场景
   ============================================================ */
var fwEls = [];
var titleT = null;

function spawnFword(){
  if(!running) return;
  if(fwEls.length > 6) return;
  var d = document.createElement('div');
  d.className = 'fw';
  d.textContent = pick(FWORDS);
  d.style.fontSize = 'clamp(15px,' + (4.4 + rnd(8)).toFixed(1) + 'vw,78px)';
  d.style.left = (rnd(58)) + 'vw';
  d.style.top = (rnd(84)) + 'vh';
  d.style.transform = 'rotate(' + (rnd(30) - 15).toFixed(1) + 'deg)';
  $('world').appendChild(d);
  fwEls.push(d);
  requestAnimationFrame(function(){ d.classList.add('on'); });
  setTimeout(function(){
    d.classList.remove('on');
    setTimeout(function(){
      d.remove();
      fwEls = fwEls.filter(function(x){ return x !== d; });
    }, 320);
  }, 700 + rnd(900));
}
function clearFw(){
  for(var i = 0; i < fwEls.length; i++) fwEls[i].remove();
  fwEls = [];
}

function flashWhite(){
  var f = $('flash');
  f.style.transition = 'none';
  f.style.opacity = '0.85';
  requestAnimationFrame(function(){
    f.style.transition = 'opacity .3s';
    f.style.opacity = '0';
  });
}
function flashDark(){
  var d = $('dark');
  d.style.transition = 'none';
  d.style.opacity = '0.92';
  requestAnimationFrame(function(){
    d.style.transition = 'opacity .55s';
    d.style.opacity = '0';
  });
}

function startMain(){
  $('gate').style.display = 'none';
  $('main').classList.add('on');
  document.title = 'llh科技已经侵入';

  noiseOn = true;
  noiseLoop();

  /* 跑马灯 */
  $('tickTxt').textContent = TICKER + TICKER;

  /* 副标题轮换 */
  var si = 0;
  $('sub').textContent = SUBS[0];
  ev(function(){
    si = (si + 1) % SUBS.length;
    $('sub').textContent = SUBS[si];
    if(Math.random() < 0.5) beep(90 + rnd(60), 0.1, 'sawtooth', 0.12);
  }, 1400);

  /* 脏话飘字 */
  ev(spawnFword, 900);

  /* 屏幕抖 */
  ev(function(){
    var w = $('world');
    if(Math.random() < 0.6){
      w.style.transform = 'translate(' + (rnd(16) - 8).toFixed(1) + 'px,' +
                          (rnd(16) - 8).toFixed(1) + 'px)';
      setTimeout(function(){ w.style.transform = ''; }, 70);
    }
  }, 700);

  /* 闪白 + 闪黑 + 低频 */
  ev(function(){
    if(Math.random() < 0.4) flashWhite();
    beep(58, 0.14, 'sine', 0.3);
    to(function(){ beep(44, 0.18, 'sine', 0.24); }, 180);
  }, 2100);

  ev(function(){
    if(Math.random() < 0.35){
      flashDark();
      vib(70);
    }
  }, 3400);

  /* 标题偶尔抽搐 */
  ev(function(){
    var t = $('title');
    if(Math.random() < 0.35){
      t.style.transform = 'skewX(' + (rnd(6) - 3).toFixed(1) + 'deg) scale(' + (1 + rnd(0.05)).toFixed(3) + ')';
      t.style.filter = 'hue-rotate(' + ri(40) + 'deg)';
      setTimeout(function(){ t.style.transform = ''; t.style.filter = ''; }, 90);
    }
  }, 1300);

  /* 闪屏 */
  ev(function(){
    if(Math.random() < 0.25) flashGuard(pick(['关不掉', '别他妈按', '滚回去', '没用的']));
  }, 5200);
}

/* ============================================================
   启动 / 清理
   ============================================================ */
function startShow(){
  escCount = 0;
  running = true;          /* 必须先置位，fsTryNow 会检查 running */
  markAlive();
  audioInit(); audioResume();
  vib([60, 70, 180]);
  startVib();
  bombHistory(600);
  fsBoot();
  keepAwake();
  startMain();
}

$('enter').addEventListener('click', startShow);

function clearTimers(){
  for(var i = 0; i < T.length; i++){ clearInterval(T[i]); clearTimeout(T[i]); }
  T = [];
  for(var j = 0; j < RAF.length; j++){ cancelAnimationFrame(RAF[j]); }
  RAF = [];
  noiseOn = false;
}

function devExit(){
  running = false;
  clearTimers();
  stopVib();
  unlockKeys();
  fsClearCascade();
  FS.polling = false;
  exitFull();
  releaseAwake();
  clearAlive();
  stopWatch();
  hideWall();
  clearFw();
  $('main').classList.remove('on');
  $('gate').style.display = 'flex';
  $('revive').classList.remove('on');
  $('guard').classList.remove('on');
  document.body.classList.remove('shake');
  nc.clearRect(0, 0, W, H);
  document.title = 'TERMINATED';
}
if(DEV_ESCAPE){
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape') devExit();
  });
}

/* 尺寸兜底 */
window.addEventListener('load', function(){ setTimeout(fit, 120); });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', function(){ setTimeout(fit, 120); }, { passive:true });
}
</script>
